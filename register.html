<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | StudentHub</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><a class="brand" href="index.html">🎓 StudentHub</a><nav aria-label="Main navigation"><ul><li><a href="index.html">Home</a></li><li><a href="events.html">Events</a></li><li><a href="login.html">Login</a></li></ul></nav></header><main id="main" class="container page narrow"><p class="eyebrow">Join StudentHub</p><h1>Create an account</h1><form id="registration-form" action="backend/register.php" method="post" novalidate><input type="hidden" name="form_type" value="registration"><div class="form-group"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required aria-describedby="name-error"><small id="name-error" class="error" aria-live="polite"></small></div><div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error"><small id="email-error" class="error" aria-live="polite"></small></div><div class="form-group"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" type="tel" inputmode="numeric" required aria-describedby="mobile-error"><small id="mobile-error" class="error" aria-live="polite"></small></div><div class="form-group"><label for="course">Course</label><select id="course" name="course" required><option value="">Select course</option><option>B.Tech</option><option>BCA</option><option>MCA</option></select><small id="course-error" class="error" aria-live="polite"></small></div><div class="form-group"><label for="year">Year</label><select id="year" name="year" required><option value="">Select year</option><option>1</option><option>2</option><option>3</option><option>4</option></select><small id="year-error" class="error" aria-live="polite"></sm
